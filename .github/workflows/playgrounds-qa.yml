name: Playgrounds listing validation
on:
  push:
    branches: [qa-playgrounds-r4]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7d8a37b21643cfa3df4fa6a96ff5bd0339c4dc8
          fetch-depth: 0
      - name: Record candidate
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run gate:v1
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: playgrounds-marketplace-preview
          path: dist/
